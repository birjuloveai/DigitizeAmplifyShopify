name: Deploy to GitHub Pages

on:
  push:
    branches: [main, tamil-survey-persist, hindi-survey-persist]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build Tamil version (root path)
      - uses: actions/checkout@v4
        with:
          ref: tamil-survey-persist
          path: tamil
      - run: cd tamil && npm ci && npm run build
        env:
          VITE_SHEET_WEBHOOK_URL: ${{ secrets.VITE_SHEET_WEBHOOK_URL }}

      # Build Hindi version (/HN/ path)
      - uses: actions/checkout@v4
        with:
          ref: hindi-survey-persist
          path: hindi
      - run: cd hindi && npm ci && npm run build
        env:
          VITE_SHEET_WEBHOOK_URL: ${{ secrets.VITE_SHEET_WEBHOOK_URL }}

      # Combine into single site
      - run: |
          mkdir -p combined
          cp -r tamil/dist/* combined/
          mkdir -p combined/HN
          cp -r hindi/dist/* combined/HN/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
